<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="nightmode" content="disable">
<title>背面 · 阿玖</title>
<meta name="description" content="那张实体卡的背面 —— 月牙、水波、游鱼，和一枚真的能扫的码。">
<link rel="icon" sizes="32x32" href="../assets/favicon-32.png">
<script src="../theme.js"></script>
<link rel="stylesheet" href="../style.css">
<script src="../assets/鱼-写出.js"></script>
<style>
  body{min-height:100vh;overflow-x:hidden}
  .hero{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:96px 0 clamp(24px,5vh,64px)}
  .card{position:relative;width:min(560px,100%);border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:0;overflow:hidden;text-align:center;
    box-shadow:0 1px 2px rgba(20,20,20,.04),0 16px 44px rgba(20,20,20,.05)}
  html[data-theme="night"] .card{box-shadow:0 1px 2px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.45)}
  .card .tools{position:absolute;top:12px;right:12px;opacity:.45;transition:opacity .25s ease;z-index:3}
  .card:hover .tools,.card .tools:focus-within{opacity:1}
  .scene{width:100%;height:auto;display:block}
  /* 1️⃣ 游鱼＝YuWrite 的宿主：压在画里鱼该在的位置（百分比由生成器按卡上真实坐标算出来）*/
  .fish{position:absolute;left:75.70%;top:80.43%;width:31.12%;
    aspect-ratio:1/1;transform:translate(-50%,-50%);color:var(--ink);cursor:pointer;z-index:2}
  .fish svg{display:block;width:100%;height:100%}
  /* 动效：只有角标、海浪（描边）与气泡（淡入上浮）在动；月牙、码、域名与它的线全部静态 */
  @keyframes drawIn{from{stroke-dashoffset:var(--l)}to{stroke-dashoffset:0}}
  @keyframes bubIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .d1{stroke-dasharray:var(--l);animation:drawIn var(--t,.5s) cubic-bezier(.22,.61,.36,1) both;animation-delay:var(--d,0s)}
  .bub{transform-box:fill-box;animation:bubIn .35s ease-out both;animation-delay:var(--d,0s)}
  /* 出图 / 减少动态：直接给终态（只关动画，绝不动颜色 —— 改了颜色就是伪造验收）*/
  html[data-nofade] .d1{animation:none;stroke-dasharray:none}
  html[data-nofade] .bub{animation:none}
  @media (prefers-reduced-motion:reduce){
    .d1{animation:none;stroke-dasharray:none}
    .bub{animation:none}
  }
</style>
</head>

    if (STILL) document.documentElement.setAttribute('data-nofade', '');
    var host = document.getElementById('fishHost');
    if (!window.YuWrite || !host) return;
    window.__writer = window.YuWrite.mount(host, { speed: 2, delay: 750, still: STILL });
    /* 点鱼＝**鱼和气泡**重来（10-01 定稿）：域名与它下面那道线是静态的，海浪与角标是环境，都不参与。
       YuWrite.play() 不再等开场延迟，所以气泡的重播排期要减去 FISH_D —— 减完仍排在鱼最后一笔之后。 */
    var SHIFT = 750 / 1000;
    var parts = [].slice.call(document.querySelectorAll('.bub'));
    parts.forEach(function (el) { el.setAttribute('data-d0', parseFloat(getComputedStyle(el).animationDelay) || 0); });
    host.addEventListener('click', function () {
      if (STILL || reduce) return;
      if (window.__writer && window.__writer.play) window.__writer.play();
      parts.forEach(function (el) {
        el.style.animationDelay = Math.max(0, parseFloat(el.getAttribute('data-d0')) - SHIFT).toFixed(3) + 's';
        /* ⚠️ SVG 元素没有 offsetWidth（读它＝undefined，不触发重排，动画根本不会重启）
           逼重排要用 getBoundingClientRect —— 10-01 就栽在这儿：气泡和划线"看着改了，其实没重播" */
        el.style.animationName = 'none'; el.getBoundingClientRect(); el.style.animationName = '';
      });
    });
  })();
</script>
</body>
</html>
