<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="nightmode" content="disable">
<title>邮箱 · 阿玖</title>
<link rel="icon" sizes="32x32" href="../assets/favicon-32.png">
<script src="../theme.js"></script>
<link rel="stylesheet" href="../style.css">
<style>
  #contactList{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:baseline;margin-top:6px}
  #contactList a{font-family:var(--mono);font-size:13.5px;letter-spacing:.08em;
    border-bottom:1px solid var(--line-strong);padding-bottom:2px}
  #contactList a:hover{color:var(--amber);border-color:var(--amber)}
  #contactList .tbd{color:var(--muted);font-family:var(--mono);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="../">← 回主页</a>
    <div class="tools">
      <div class="theme">
        <button type="button" id="themeBtn" title="切换白天 / 深夜" aria-label="切换白天 / 深夜">
          <svg class="ico ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.1"></circle>
            <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5L17 7M7 17l-1.5 1.5"></path>
          </svg>
          <svg class="ico ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <main id="page">
    <section class="subpage">
      <p class="page-kicker">邮箱</p>
      <h1>邮箱</h1>
      <div id="mailBody"></div>
    </section>
  </main>
</div>
<script src="../site-data.js"></script>
<script src="../render.js"></script>
</body>
</html>
