<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="nightmode" content="disable">
<title>互动 · 阿玖</title>
<link rel="icon" sizes="32x32" href="../assets/favicon-32.png">
<script src="../theme.js"></script>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="notes.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="../">← 回主页</a>
    <div class="tools">
      <div class="theme">
        <button type="button" id="themeBtn" title="切换白天 / 深夜" aria-label="切换白天 / 深夜">
          <svg class="ico ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.1"></circle>
            <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5L17 7M7 17l-1.5 1.5"></path>
          </svg>
          <svg class="ico ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <main id="page">
    <section class="subpage">
      <p class="page-kicker">互动</p>
      <h1>互动</h1>
      <p class="note" style="margin:0 0 clamp(22px,4vh,40px)">一页一条。写完落进最新的一页，翻到底就是此刻。</p>

      <!-- ── 册子：摊开双页(占满内容宽) ── -->
      <section class="book-wrap" id="bookWrap">
        <div class="book" id="book">
          <div class="edge-stack" id="edgeStack"></div>
          <div class="spread" id="spread"></div>
          <button class="nav prev" id="prevBtn" type="button" aria-label="上一页">‹</button>
          <button class="nav next" id="nextBtn" type="button" aria-label="下一页">›</button>
        </div>
        <div class="folio">
          <button class="folio-btn" id="folioBtn" type="button" aria-label="打开目录">
            <span id="folioNum">— / —</span><span class="caret">⌄</span>
          </button>
          <button class="write-btn" id="writeBtn" type="button">✎ 留一页</button>
        </div>
        <div class="toc" id="toc" hidden>
          <div class="toc-head">
            <span class="toc-kicker">目录 Contents</span>
            <button type="button" class="sheet-close" id="tocClose" aria-label="收起目录">✕</button>
          </div>
          <div class="toc-grid" id="tocGrid"></div>
        </div>
      </section>
    </section>
  </main>
</div>

<!-- ── 写一页：稿纸便签 ── -->
<div class="sheet-mask" id="sheetMask" hidden>
  <form class="sheet" id="sheetForm">
    <div class="sheet-head">
      <span class="sheet-kicker">新页 · No.<b id="sheetNo">01</b></span>
      <button type="button" class="sheet-close" id="sheetClose" aria-label="收起">✕</button>
    </div>
    <input class="sheet-nick" id="nickInput" maxlength="16" placeholder="昵称（可空）" autocomplete="off">
    <textarea class="sheet-body" id="bodyInput" maxlength="240" rows="5"
              placeholder="写点什么…一页装得下的那种" required></textarea>
    <div class="sheet-foot">
      <span class="cnt" id="cnt">0 / 240</span>
      <button type="submit" class="go">落笔 →</button>
    </div>
  </form>
</div>

<script type="module" src="book.js"></script>
</body>
</html>
