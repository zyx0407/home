<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="nightmode" content="disable">
<title>阿玖 · zyx0407</title>
<meta name="description" content="阿玖（zyx0407）—— 做点有意思的东西。">
<meta name="author" content="阿玖 zyx0407">
<link rel="canonical" href="https://zyx0407.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="阿玖 · zyx0407">
<meta property="og:description" content="做点有意思的东西 · 欢迎来到阿玖的网页qwq">
<meta property="og:url" content="https://zyx0407.com/">
<meta property="og:image" content="https://zyx0407.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" sizes="180x180" href="assets/favicon-180.png">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<script src="assets/鱼-写出.js"></script>
<script src="assets/平滑滚动.js" defer></script>
<style>
  /* 主页专用（通用部分在共享的 style.css 里） */
  body{min-height:100vh;overflow-x:hidden}

  /* 首屏别把「关于我」顶到太下面：收紧首屏下留白与段落间距 */
  section.block{margin-top:clamp(26px,5vh,58px)}
  .name{font-size:clamp(24px,3.2vw,34px);letter-spacing:.02em;margin:0 0 10px}
  .tag,.sub{font-size:14.5px;color:var(--muted);margin:0 auto;max-width:33em;line-height:1.9}
  .links{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:0 0 16px}
  @media (max-width:430px){.links{grid-template-columns:repeat(2,1fr)}}
  .lnk{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--chip);border-radius:999px;
    padding:6px 13px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);
    transition:border-color .22s,color .22s,background-color .22s}
  .lnk:hover{border-color:var(--amber);color:var(--amber);background:var(--bg)}
  .lnk.soon{opacity:.55;cursor:default}
  .lnk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
  .legal{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;margin:0}

  /* 「作品」做成入口（不是普通导航文字） */
  .entry{display:inline-flex;align-items:center;gap:14px;margin:34px 0 0;
    padding:12px 20px;border:1px solid var(--chip);border-radius:4px;
    font-family:var(--mono);font-size:13.5px;letter-spacing:.1em;
    transition:border-color .25s,color .25s,background-color .25s}
  .entry:hover{border-color:var(--amber);color:var(--amber);background:var(--hover)}
  .entry .arrow{transition:transform .3s cubic-bezier(.22,.61,.36,1)}
  .entry:hover .arrow{transform:translateX(5px)}
  /* 入口的三种样式（在 /定制台/ 里挑） */
  .entry-line{border:0;border-bottom:1px solid var(--line-strong);border-radius:0;padding:2px 0;margin-top:34px}
  .entry-line:hover{background:none;border-color:var(--amber)}
  .entry-arrow{border:0;border-radius:0;padding:2px 0;margin-top:34px;font-size:15px;letter-spacing:.04em;gap:10px}
  .entry-arrow:hover{background:none}
  .nav-about{font-family:var(--mono);font-size:13.5px;letter-spacing:.1em;
    border-bottom:1px solid var(--line-strong);padding-bottom:2px;transition:color .25s,border-color .25s}
  .nav-about:hover{color:var(--amber);border-color:var(--amber)}

  /* ① 鱼标：连笔写出动画（点一下重播） */
  /* ① 主屏：居中卡片 */
  .hero{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:96px 0 clamp(24px,5vh,64px)}
  /* 首屏只有这张卡片：顶端只留一枚主题按钮 */
  .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;
    padding:18px clamp(18px,3vw,30px) 0;gap:12px}
  .card{position:relative;width:min(560px,100%);border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:clamp(26px,3.4vw,42px) clamp(20px,3vw,38px);text-align:center;
    box-shadow:0 1px 2px rgba(20,20,20,.04),0 16px 44px rgba(20,20,20,.05)}
  html[data-theme="night"] .card{box-shadow:0 1px 2px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.45)}
  /* 主题按钮收进卡片右上角：平时淡，鼠标进卡片才亮 */
  .card .tools{position:absolute;top:12px;right:12px;opacity:.45;transition:opacity .25s ease}
  .card:hover .tools,.card .tools:focus-within{opacity:1}
  .avatar{width:88px;height:88px;margin:0 auto 16px;border-radius:50%;border:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
  #mark{width:62px;height:62px;cursor:pointer;margin:0}
  #mark .yu-svg{display:block;width:100%;height:100%}

  /* ② 划出一条线 */
  .wire{width:56px;height:1px;background:var(--line-strong);margin:20px auto;
    transform-origin:center;transform:scaleX(0);transition:transform .9s cubic-bezier(.22,.61,.36,1) .35s}
  .wire.go{transform:scaleX(1)}

  /* ③ 名号逐字显影 */
  .name .ch{display:inline-block;opacity:0;transform:translateY(16px);filter:blur(7px)}
  .name .ch.in{opacity:1;transform:none;filter:blur(0);
    transition:opacity .55s ease,transform .65s cubic-bezier(.22,.61,.36,1),filter .65s ease}

  /* ④ 打字机光标 */
  .caret{display:inline-block;width:1px;height:1em;background:var(--amber);margin-left:2px;
    vertical-align:-2px;animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ⑤ 滚动进入 */
  .reveal{opacity:0;transform:translateY(20px)}
  .reveal.on{opacity:1;transform:none;transition:opacity .75s ease,transform .75s cubic-bezier(.22,.61,.36,1)}

  /* ⑥ 页脚计时 */
  .stats{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}

  /* 关于我 / 联络 */
  .lede{max-width:34em;font-size:clamp(15px,1.5vw,17.5px);line-height:1.95}
  .lede + .lede{margin-top:1.1em;color:var(--muted)}
  #contactList{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:baseline;margin-top:6px}
  #contactList a{font-family:var(--mono);font-size:13.5px;letter-spacing:.08em;
    border-bottom:1px solid var(--line-strong);padding-bottom:2px}
  #contactList a:hover{color:var(--amber);border-color:var(--amber)}
  #contactList .tbd{color:var(--muted);font-family:var(--mono);font-size:12.5px}
  section.block{margin:clamp(44px,9vh,110px) 0 0}
  .block h2{font-size:clamp(15px,1.5vw,17px);font-weight:600;margin:0 0 16px}

  /* 出图用：关掉一切过渡、直接给终态（截图规则只允许"关过渡"，不许改颜色） */
  html[data-nofade] .reveal,html[data-nofade] .reveal.on{opacity:1;transform:none;transition:none}
  html[data-nofade] .name .ch{opacity:1;transform:none;filter:none;transition:none}
  html[data-nofade] .wire{transform:scaleX(1);transition:none}

  @media (prefers-reduced-motion:reduce){
    .wire{transform:scaleX(1);transition:none}
    .caret{animation:none}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="tools">
      <div class="theme">
        <button type="button" id="themeBtn" title="切换白天 / 深夜" aria-label="切换白天 / 深夜">
          <svg class="ico ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.1"></circle>
            <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5L17 7M7 17l-1.5 1.5"></path>
          </svg>
          <svg class="ico ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <main id="page">
    <section class="hero">
      <div class="card">
        <div class="avatar" id="avatarBox"><div id="mark" title="点一下：让它再写一遍"></div></div>
        <h1 class="name" id="name"></h1>
        <p class="sub"></p>
        <div class="wire" id="wire"></div>
        <nav class="links" id="links"></nav>
        <p class="legal" id="legal"></p>
      </div>
    </section>

  </main>
</div>

<script src="site-data.js"></script>
<script src="render.js"></script>
<script>
  var q = location.search;
  var OFFSET = Number((/[?&]type=(\d+)/.exec(q) || [])[1] || 0);
  var STILL = /[?&]still=1/.test(q);
  var NOFADE = /[?&]nofade=1/.test(q);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (STILL || NOFADE) document.documentElement.setAttribute('data-nofade', '');

  /* ── settings：外观与组件都由它决定（在 /定制台/ 里改） ── */
  var S = window.SITE || {};
  var SE = S.settings || {};
  var FISH = SE.fish || 'write';
  var USE_WIRE = SE.wire !== false;
  var NAME_ANIM = SE.nameAnim || 'chars';
  var SUB_ANIM = SE.subAnim || 'type';
  var ENTRY = SE.entryStyle || 'box';
  var FOOTER_TIMER = SE.footerTimer !== false;

  /* 区域顺序（关于我 / 作品入口 / 联络） */
  var pageEl = document.getElementById('page');
  var footerEl = pageEl.querySelector('footer');
  var IDS = { about: 'about', works: 'worksEntry', contact: 'contactSection' };
  (SE.order || ['about', 'works', 'contact']).forEach(function (key) {
    var el = document.getElementById(IDS[key] || '');
    if (el) pageEl.insertBefore(el, footerEl);
  });

  /* 作品入口：box / line / arrow / none */
  var entryEl = document.getElementById('navWork');
  var entryBox = document.getElementById('worksEntry');
  if (ENTRY === 'none') { if (entryBox) entryBox.style.display = 'none'; }
  else if (entryEl) entryEl.className = 'entry entry-' + ENTRY;

  /* ① 鱼标：写出 / 静态 / 不要 */
  var markEl = document.getElementById('mark');
  if (FISH === 'none') {
    if (markEl) markEl.style.display = 'none';
  } else if (window.YuWrite) {
    window.__writer = window.YuWrite.mount(markEl, {
      speed: 1.5, delay: 420,
      still: STILL || NOFADE || FISH === 'still'
    });
  }

  /* ② 划出一条线 */
  if (!USE_WIRE) {
    var wireEl = document.getElementById('wire');
    if (wireEl) wireEl.style.display = 'none';
  } else {
    setTimeout(function () { document.getElementById('wire').classList.add('go'); }, STILL ? 0 : 300);
  }

  /* ③ 名号：逐字显影 / 直接出现（两种情况 DOM 一致，只是有没有过渡） */
  var nameEl = document.getElementById('name');
  var NAME = (S.who && S.who.name) || '阿玖';
  nameEl.innerHTML = NAME.split('').map(function (c) { return '<span class="ch">' + c + '</span>'; }).join('');
  var chs = nameEl.querySelectorAll('.ch');
  if (NAME_ANIM === 'none' || STILL || reduce) {
    [].forEach.call(chs, function (ch) { ch.style.transition = 'none'; ch.classList.add('in'); });
  } else {
    [].forEach.call(chs, function (ch, i) {
      setTimeout(function () { ch.classList.add('in'); }, 140 + i * 120);
    });
  }

  /* ④ 副题：打字机 / 直接出现 */
  var LINE = [S.sub, S.headline].filter(Boolean).join(' · ');
  var FISH_END = (window.YuWrite && window.YuWrite.END) || 4560;      // 写出动画真实结束时间
  var TEXT_END = Math.max(600, FISH_END - (STILL ? 0 : 60));          // 文字比它早 60ms 收尾（视觉上同时）
  var subEl = document.querySelector('.hero .sub');
  var caret = '<span class="caret"></span>';
  if (SUB_ANIM === 'none' || STILL || reduce || !LINE) {
    subEl.textContent = LINE;
  } else {
    var i = Math.min(OFFSET, LINE.length);
    subEl.innerHTML = LINE.slice(0, i) + caret;
    if (i < LINE.length) {
      var per = Math.max(30, (TEXT_END - 140) / Math.max(1, LINE.length));   // 每个字的间隔 = 让最后一个字正好落在 TEXT_END
      var t = setInterval(function () {
        i++; subEl.innerHTML = LINE.slice(0, i) + caret;
        if (i >= LINE.length) clearInterval(t);
      }, per);
      window.__timing = { fishEnd: Math.round(FISH_END), textEnd: Math.round(TEXT_END), per: Math.round(per), chars: LINE.length };
    }
  }

  /* ⑤ 滚动进入 */
  var blocks = document.querySelectorAll('.reveal');
  if (NOFADE || !('IntersectionObserver' in window)) {
    [].forEach.call(blocks, function (b) { b.classList.add('on'); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    [].forEach.call(blocks, function (b) { io.observe(b); });
  }

  /* ④b 入口胶囊（数据驱动：home.links）+ 最底小字 + 头像 */
  var home = S.home || {};
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  var ICON = {
    works:'<svg viewBox="0 0 24 24"><path d="M4 12h13M12 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    about:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.4-3.6 4-5.4 7-5.4s5.6 1.8 7 5.4" stroke-linecap="round"/></svg>',
    github:'<svg viewBox="0 0 24 24"><path d="M9 19c-4 1.3-4-2.2-6-2.6m12 5.6v-3.4c0-1 .1-1.4-.5-2 2.3-.3 4.5-1.2 4.5-5.2a4 4 0 0 0-1.1-2.8 3.7 3.7 0 0 0-.1-2.8s-1.2-.4-3.9 1.4a9.4 9.4 0 0 0-5 0C6.2 4.6 5 5 5 5a3.7 3.7 0 0 0-.1 2.8A4 4 0 0 0 3.8 10.6c0 4 2.2 4.9 4.5 5.2-.5.5-.5 1-.5 1.8V22" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m4 7 8 6 8-6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    link:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1.4 1.4M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1.4-1.4" stroke-linecap="round"/></svg>'
  };
  var toolsEl = document.querySelector('.top .tools');
  var cardEl = document.querySelector('.card');
  if (toolsEl && cardEl) cardEl.appendChild(toolsEl);
  var topEl = document.querySelector('.top');
  if (topEl && !topEl.children.length) topEl.parentNode.removeChild(topEl);

  var linksEl = document.getElementById('links');
  if (linksEl) {
    linksEl.innerHTML = ((home.links || [])).map(function (l) {
      var soon = !l.href;
      return '<' + (soon ? 'span' : 'a') + (soon ? '' : ' href="' + l.href + '"') +
        (soon ? ' title="待定"' : (l.href.charAt(0) === 'h' ? ' target="_blank" rel="noopener"' : '')) +
        ' class="lnk' + (soon ? ' soon' : '') + '">' + (ICON[l.icon] || ICON.link) + esc(l.label) + '</' + (soon ? 'span' : 'a') + '>';
    }).join('');
  }
  var legalEl = document.getElementById('legal');
  if (legalEl) {
    var fo = (window.SITE && window.SITE.footer) || {};
    legalEl.textContent = [fo.copy, fo.site].filter(Boolean).join(' · ');
  }
  var av = document.getElementById('avatarBox');
  if (av && home.avatar) { av.style.backgroundImage = 'url(' + home.avatar + ')'; av.style.backgroundSize = 'cover'; }

  /* ⑥ 页脚计时（可在 /定制台/ 关掉） */
  var statsEl = document.getElementById('stats') || document.createElement('i');
  if (!FOOTER_TIMER) {
    statsEl.style.display = 'none';
  } else {
    var t0 = Date.now();
    (function tick() {
      var s = Math.floor((Date.now() - t0) / 1000);
      statsEl.textContent = s < 3 ? '' : '你在这里待了 ' + s + ' 秒';
      setTimeout(tick, 1000);
    })();
  }
</script>
</body>
</html>
