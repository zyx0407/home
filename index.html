<style>
  /* 主页专用（通用部分在共享的 style.css 里） */
  body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
  /* 主页天气：铅笔雨丝 canvas（铺在内容下面、不挡点击） */
  #rain{position:fixed;inset:0;display:block;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1}
  /* 页面最底部：备案信息（ICP 备案号 2026-10-22 到手已填，不塞进卡片） */
  .site-foot{position:fixed;left:0;right:0;bottom:0;z-index:2;display:block;text-align:center;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--foot-ink);
    padding:0 16px calc(18px + env(safe-area-inset-bottom));pointer-events:none}
  .site-foot .sep{margin:0 9px;opacity:.5}
  .site-foot a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;pointer-events:auto}
  .site-foot a:hover{color:var(--amber);border-color:var(--amber-soft)}
  /* 3D 卡片：正面＝门面，背面＝实体卡卡背（2026-10-17） */
  /* 缩放壳：卡片内在尺寸钉死 560×353（CR80），窄屏整卡等比缩，不改一像素排版 */
  .card-fit{display:flex;justify-content:center;width:100%}
  .card3d{position:relative;width:620px;flex:none;transform-origin:top center;perspective:1400px}
  .card3d-inner{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.22,.61,.36,1);touch-action:none;user-select:none;-webkit-user-select:none;--thick:4px}
  /* 触屏：不接管手势（否则页面滑不动），只保留点一下翻面 */
  @media (hover:none),(pointer:coarse){
    .card3d-inner{touch-action:auto}
  }
  .card3d.flipped .card3d-inner{transform:rotateY(180deg)}
  .card{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .card3d .card-front{transform:translateZ(0)}
  .card3d .card-back{position:absolute;inset:0;padding:0;overflow:hidden;transform:rotateY(180deg) translateZ(calc(var(--thick) + 0.5px))}
  /* 卡背小鱼：完整版右下角那条连笔鱼（静态，不播写出动画） */
  /* 卡背＝用实体卡原图（美术\卡片彩印图\卡片彩印-背面.png 重新上色），昼/夜两张，铺满卡面 */
  .card3d .card-back .back-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .card3d .card-back .back-night{display:none}
  html[data-theme="night"] .card3d .card-back .back-day{display:none}
  html[data-theme="night"] .card3d .card-back .back-night{display:block}
  /* 卡片厚度：正面背后叠一叠"纸片"（每层退 1px），像名片薄薄一层 */
  .card-slice{position:absolute;inset:0;background:var(--card);border-radius:23px;pointer-events:none;backface-visibility:hidden}
  /* 视角流光：跟随鼠标的光泽层（视角函数，不是时间动画） */
  .card-shine{position:absolute;inset:0;border-radius:23px;pointer-events:none;z-index:9;transform:translateZ(10px);
    background:radial-gradient(60% 45% at var(--mx,50%) var(--my,42%), rgba(255,255,255,.16), rgba(255,255,255,.05) 45%, transparent 72%);
    mix-blend-mode:soft-light}
  html[data-theme="night"] .card-shine{
    background:radial-gradient(60% 45% at var(--mx,50%) var(--my,42%), rgba(255,255,255,.10), rgba(255,255,255,.03) 45%, transparent 72%)}
  html[data-nofade] .card3d-inner{transition:none}
  @media (prefers-reduced-motion:reduce){.card3d-inner{transition:none}}

  /* 首屏别把「关于我」顶到太下面：收紧首屏下留白与段落间距 */
  section.block{margin-top:clamp(26px,5vh,58px)}
  .name{font-size:29px;letter-spacing:.02em;margin:0 0 10px}
  .tag,.sub{font-size:14.5px;color:var(--muted);margin:0 auto;max-width:33em;line-height:1.9}
  .links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:0 0 16px}
  @media (max-width:430px){.links{gap:8px}.sub{font-size:13px}.legal{font-size:10px;letter-spacing:.02em;column-gap:12px}.legal .sep{display:none}}
  .lnk{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--chip);border-radius:999px;
    padding:6px 0;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);
    min-width:0;white-space:nowrap;overflow:hidden;
    transition:border-color .22s,color .22s,background-color .22s}
  .lnk:hover{border-color:var(--amber);color:var(--amber);background:var(--bg)}
  .lnk.soon{cursor:default}
  /* 桌面 hover：图标右移 + 琥珀下划线从中间展开 */
  @media (hover:hover) and (pointer:fine){
    .lnk{position:relative}
    .lnk::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:1px;background:var(--amber);
      transform:translateX(-50%) scaleX(0);transition:transform .25s cubic-bezier(.22,.61,.36,1)}
    .lnk.soon::after{display:none}
    .lnk:hover::after{transform:translateX(-50%) scaleX(1)}
    .lnk svg{transition:transform .25s cubic-bezier(.22,.61,.36,1)}
    .lnk:hover svg{transform:translateX(3px)}
  }
  .lnk.soon:hover{border-color:var(--chip);color:var(--muted);background:none}
  .lnk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
  .legal{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;margin:0;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline}
  .legal .lp{white-space:nowrap}
  .legal .sep{white-space:pre}
  /* 投喂：功能已下，只留这一句（2026-10-23） */
  .tip{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto 0;width:100%;
    border:0;background:none;padding:6px 12px;border-radius:999px;line-height:normal;
    font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
  .tip b{font-weight:600;color:var(--amber)}

  /* 「作品」做成入口（不是普通导航文字） */
  .entry{display:inline-flex;align-items:center;gap:14px;margin:34px 0 0;
    padding:12px 20px;border:1px solid var(--chip);border-radius:4px;
    font-family:var(--mono);font-size:13.5px;letter-spacing:.1em;
    transition:border-color .25s,color .25s,background-color .25s}
  .entry:hover{border-color:var(--amber);color:var(--amber);background:var(--hover)}
  .entry .arrow{transition:transform .3s cubic-bezier(.22,.61,.36,1)}
  .entry:hover .arrow{transform:translateX(5px)}
  /* 入口的三种样式（在 /定制台/ 里挑） */
  .entry-line{border:0;border-bottom:1px solid var(--line-strong);border-radius:0;padding:2px 0;margin-top:34px}
  .entry-line:hover{background:none;border-color:var(--amber)}
  .entry-arrow{border:0;border-radius:0;padding:2px 0;margin-top:34px;font-size:15px;letter-spacing:.04em;gap:10px}
  .entry-arrow:hover{background:none}
  .nav-about{font-family:var(--mono);font-size:13.5px;letter-spacing:.1em;
    border-bottom:1px solid var(--line-strong);padding-bottom:2px;transition:color .25s,border-color .25s}
  .nav-about:hover{color:var(--amber);border-color:var(--amber)}

  /* ① 鱼标：连笔写出动画（点一下重播） */
  /* ① 主屏：居中卡片 */
  .hero{display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;padding:96px 0 clamp(24px,5vh,64px)}
  /* 首屏只有这张卡片：顶端只留一枚主题按钮 */
  .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;
    padding:18px clamp(18px,3vw,30px) 0;gap:12px}
  .card{position:relative;width:620px;height:391px;border:1px solid var(--line);border-radius:23px;background:var(--card);
    padding:34px 29px;text-align:center;
    box-shadow:0 1px 2px rgba(20,20,20,.04),0 16px 44px rgba(20,20,20,.05)}
  /* 正面竖排：上半组（头像→胶囊）居中、底部两行自己贴底，中间留真空白 */
  .card-front{display:flex;flex-direction:column;align-items:center}
  .card-front .links{width:100%}
  .card-front .tip{margin-top:auto}
  /* 角落小猫（2026-11-04 他选 C；同日改透明底两版——混合模式把细笔画稀释成灰，白天看不清）：
     昼/夜各一张 RGBA 素材（墨色／白墨），直接铺，不做 filter、不做 blend */
  .corner-cat{position:absolute;right:22px;bottom:16px;width:56px;height:56px;object-fit:contain;
    pointer-events:none;image-rendering:pixelated;display:block}
  .corner-cat-night{display:none}
  html[data-theme="night"] .corner-cat-day{display:none}
  html[data-theme="night"] .corner-cat-night{display:block}
  html[data-theme="night"] .card{box-shadow:0 1px 2px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.45)}
  /* 主题按钮收进卡片右上角：平时淡，鼠标进卡片才亮；GitHub 小钮并排 */
  .card .tools{position:absolute;top:12px;right:12px;opacity:.45;transition:opacity .25s ease;display:flex;align-items:center;gap:6px}
  .card:hover .tools,.card .tools:focus-within{opacity:1}
  .legal a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;transition:color .22s,border-color .22s;white-space:nowrap}
  .legal a:hover{color:var(--amber);border-color:var(--amber-soft)}
  .avatar{width:88px;height:88px;margin:0 auto 16px;border-radius:50%;border:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
  #mark{width:62px;height:62px;cursor:pointer;margin:0}
  #mark .yu-svg{display:block;width:100%;height:100%}

  /* ② 划出一条线 */
  .wire{width:56px;height:1px;background:var(--line-strong);margin:20px auto;
    transform-origin:center;transform:scaleX(0);transition:transform .9s cubic-bezier(.22,.61,.36,1) .35s}
  .wire.go{transform:scaleX(1)}

  /* ③ 名号逐字显影 */
  .name .ch{display:inline-block;opacity:0;transform:translateY(16px);filter:blur(7px)}
  .name .ch.in{opacity:1;transform:none;filter:blur(0);
    transition:opacity .55s ease,transform .65s cubic-bezier(.22,.61,.36,1),filter .65s ease}

  /* ④ 打字机光标 */
  .caret{display:inline-block;width:1px;height:1em;background:var(--amber);margin-left:2px;
    vertical-align:-2px;animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ⑤ 滚动进入 */
  .reveal{opacity:0;transform:translateY(20px)}
  .reveal.on{opacity:1;transform:none;transition:opacity .75s ease,transform .75s cubic-bezier(.22,.61,.36,1)}

  /* ⑥ 页脚计时 */
  .stats{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}

  section.block{margin:clamp(44px,9vh,110px) 0 0}
  .block h2{font-size:clamp(15px,1.5vw,17px);font-weight:600;margin:0 0 16px}

  /* 出图用：关掉一切过渡、直接给终态（截图规则只允许"关过渡"，不许改颜色） */
  html[data-nofade] .reveal,html[data-nofade] .reveal.on{opacity:1;transform:none;transition:none}
  html[data-nofade] .name .ch{opacity:1;transform:none;filter:none;transition:none}
  html[data-nofade] .wire{transform:scaleX(1);transition:none}

  @media (prefers-reduced-motion:reduce){
    .wire{transform:scaleX(1);transition:none}
    .caret{animation:none}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>

<script>
  var q = location.search;
  var OFFSET = Number((/[?&]type=(\d+)/.exec(q) || [])[1] || 0);
  var STILL = /[?&]still=1/.test(q);
  var NOFADE = /[?&]nofade=1/.test(q);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (STILL || NOFADE) document.documentElement.setAttribute('data-nofade', '');

  /* ── settings：外观与组件都由它决定（在 /定制台/ 里改） ── */
  var S = window.SITE || {};
  var SE = S.settings || {};
  var FISH = SE.fish || 'write';
  var USE_WIRE = SE.wire !== false;
  var NAME_ANIM = SE.nameAnim || 'chars';
  var SUB_ANIM = SE.subAnim || 'type';
  var ENTRY = SE.entryStyle || 'box';
  var FOOTER_TIMER = SE.footerTimer !== false;

  /* 区域顺序（关于我 / 作品入口 / 联络） */
  var pageEl = document.getElementById('page');
  var footerEl = pageEl.querySelector('footer');
  var IDS = { about: 'about', works: 'worksEntry', contact: 'contactSection' };
  (SE.order || ['about', 'works', 'contact']).forEach(function (key) {
    var el = document.getElementById(IDS[key] || '');
    if (el) pageEl.insertBefore(el, footerEl);
  });

  /* 作品入口：box / line / arrow / none */
  var entryEl = document.getElementById('navWork');
  var entryBox = document.getElementById('worksEntry');
  if (ENTRY === 'none') { if (entryBox) entryBox.style.display = 'none'; }
  else if (entryEl) entryEl.className = 'entry entry-' + ENTRY;

  /* ① 鱼标：写出 / 静态 / 不要 */
  var markEl = document.getElementById('mark');
  if (FISH === 'none') {
    if (markEl) markEl.style.display = 'none';
  } else if (window.YuWrite) {
    window.__writer = window.YuWrite.mount(markEl, {
      speed: 1.5, delay: 420,
      still: STILL || NOFADE || FISH === 'still'
    });
  }

  /* ② 划出一条线 */
  if (!USE_WIRE) {
    var wireEl = document.getElementById('wire');
    if (wireEl) wireEl.style.display = 'none';
  } else {
    setTimeout(function () { document.getElementById('wire').classList.add('go'); }, STILL ? 0 : 300);
  }

  /* ③ 名号：逐字显影 / 直接出现（两种情况 DOM 一致，只是有没有过渡） */
  var nameEl = document.getElementById('name');
  var NAME = (S.who && S.who.name) || '阿玖';
  nameEl.innerHTML = NAME.split('').map(function (c) { return '<span class="ch">' + c + '</span>'; }).join('');
  var chs = nameEl.querySelectorAll('.ch');
  if (NAME_ANIM === 'none' || STILL || reduce) {
    [].forEach.call(chs, function (ch) { ch.style.transition = 'none'; ch.classList.add('in'); });
  } else {
    [].forEach.call(chs, function (ch, i) {
      setTimeout(function () { ch.classList.add('in'); }, 140 + i * 120);
    });
  }

  /* ④ 副题：打字机 / 直接出现 */
  var LINE = [S.sub, S.headline].filter(Boolean).join(' · ');
  var FISH_END = (window.YuWrite && window.YuWrite.END) || 4560;      // 写出动画真实结束时间
  var TEXT_END = Math.max(600, FISH_END - (STILL ? 0 : 60));          // 文字比它早 60ms 收尾（视觉上同时）
  var subEl = document.querySelector('.hero .sub');
  var caret = '<span class="caret"></span>';
  if (SUB_ANIM === 'none' || STILL || reduce || !LINE) {
    subEl.textContent = LINE;
  } else {
    var i = Math.min(OFFSET, LINE.length);
    subEl.innerHTML = LINE.slice(0, i) + caret;
    if (i < LINE.length) {
      var per = Math.max(30, (TEXT_END - 140) / Math.max(1, LINE.length));   // 每个字的间隔 = 让最后一个字正好落在 TEXT_END
      var t = setInterval(function () {
        i++; subEl.innerHTML = LINE.slice(0, i) + caret;
        if (i >= LINE.length) clearInterval(t);
      }, per);
      window.__timing = { fishEnd: Math.round(FISH_END), textEnd: Math.round(TEXT_END), per: Math.round(per), chars: LINE.length };
    }
  }

  /* ⑤ 滚动进入 */
  var blocks = document.querySelectorAll('.reveal');
  if (NOFADE || !('IntersectionObserver' in window)) {
    [].forEach.call(blocks, function (b) { b.classList.add('on'); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    [].forEach.call(blocks, function (b) { io.observe(b); });
  }

  /* ④b 入口胶囊（数据驱动：home.links）+ 最底小字 + 头像 */
  var home = S.home || {};
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  var ICON = {
    works:'<svg viewBox="0 0 24 24"><path d="M4 12h13M12 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    about:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.4-3.6 4-5.4 7-5.4s5.6 1.8 7 5.4" stroke-linecap="round"/></svg>',
    github:'<svg viewBox="0 0 24 24"><path d="M9 19c-4 1.3-4-2.2-6-2.6m12 5.6v-3.4c0-1 .1-1.4-.5-2 2.3-.3 4.5-1.2 4.5-5.2a4 4 0 0 0-1.1-2.8 3.7 3.7 0 0 0-.1-2.8s-1.2-.4-3.9 1.4a9.4 9.4 0 0 0-5 0C6.2 4.6 5 5 5 5a3.7 3.7 0 0 0-.1 2.8A4 4 0 0 0 3.8 10.6c0 4 2.2 4.9 4.5 5.2-.5.5-.5 1-.5 1.8V22" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m4 7 8 6 8-6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    link:'<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1.4 1.4M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1.4-1.4" stroke-linecap="round"/></svg>'
  };
  var toolsEl = document.querySelector('.top .tools');
  var cardEl = document.querySelector('.card');
  if (toolsEl && cardEl) cardEl.appendChild(toolsEl);
  var topEl = document.querySelector('.top');
  if (topEl && !topEl.children.length) topEl.parentNode.removeChild(topEl);

  var linksEl = document.getElementById('links');
  if (linksEl) {
    linksEl.innerHTML = ((home.links || [])).map(function (l) {
      var soon = !l.href;
      return '<' + (soon ? 'span' : 'a') + (soon ? '' : ' href="' + l.href + '"') +
        (soon ? ' title="待定"' : (l.href.charAt(0) === 'h' ? ' target="_blank" rel="noopener"' : '')) +
        ' class="lnk' + (soon ? ' soon' : '') + '">' + (ICON[l.icon] || ICON.link) + esc(l.label) + '</' + (soon ? 'span' : 'a') + '>';
    }).join('');
    /* 胶囊按条数分列（作品页下架后只剩 2 颗；以后加也自动排） */
    var nLnk = (home.links || []).length;
    if (nLnk) linksEl.style.gridTemplateColumns = 'repeat(' + nLnk + ',minmax(0,1fr))';
  }
  var legalEl = document.getElementById('legal');
  if (legalEl) {
    var fo = (window.SITE && window.SITE.footer) || {};
    var legalParts = [esc(fo.copy), esc(fo.site)].filter(Boolean);
    legalParts.push('<a class="ghlink" href="https://github.com/zyx0407" target="_blank" rel="noopener">GitHub ↗</a>');
    legalEl.innerHTML = legalParts.map(function (p) { return '<span class="lp">' + p + '</span>'; })
      .join('<span class="sep"> · </span>');
  }
  var footEl = document.getElementById('siteFoot');
  if (footEl && window.SITE && window.SITE.footer && window.SITE.footer.icp) {
    var fp = window.SITE.footer;
    var footParts = ['<a href="' + (fp.icpUrl || 'https://beian.miit.gov.cn/') +
      '" target="_blank" rel="noopener">' + esc(fp.icp) + '</a>'];
    if (fp.mps) {
      footParts.push('<a href="' + (fp.mpsUrl || 'https://beian.mps.gov.cn/') +
        '" target="_blank" rel="noopener">' + esc(fp.mps) + '</a>');
    }
    footEl.innerHTML = footParts.join('<span class="sep">·</span>');
  }
  var av = document.getElementById('avatarBox');
  if (av && home.avatar) { av.style.backgroundImage = 'url(' + home.avatar + ')'; av.style.backgroundSize = 'cover'; }

  /* ⑦ 3D 卡片：按住任意方向拖动＝阻尼跟手自由旋转，松手吸附到正面/背面；点一下＝翻面 */
  (function () {
    var inner = document.getElementById('card3dInner');
    if (!inner) return;
    /* 先叠出卡片厚度：正面背后 4 层纸片（每层退 1px），像名片的薄边 */
    for (var si = 1; si <= 4; si++) {
      var sl = document.createElement('div');
      sl.className = 'card-slice';
      sl.setAttribute('aria-hidden', 'true');
      sl.style.transform = 'translateZ(' + (-si) + 'px)';
      inner.insertBefore(sl, inner.firstChild);
    }
    var reduceMove = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var ax = 0, ay = 0;          /* 当前角度 */
    var txA = 0, txY = 0;        /* 目标角度（拖动时累积，渲染层阻尼跟随） */
    var dragging = false, moved = false, lx = 0, ly = 0, raf = 0;
    function draw() { inner.style.transform = 'rotateX(' + ax.toFixed(2) + 'deg) rotateY(' + ay.toFixed(2) + 'deg)'; }
    function follow() {
      raf = 0;
      if (!dragging) return;
      ax += (txA - ax) * 0.22;
      ay += (txY - ay) * 0.22;
      draw();
      raf = requestAnimationFrame(follow);
    }
    function snap() {
      var m = ((ay % 360) + 360) % 360;
      var base = ay - m;
      ay = (m > 90 && m < 270) ? base + 180 : (m <= 90 ? base : base + 360);
      var mx = ((ax % 360) + 360) % 360;
      var bx = ax - mx;
      ax = mx <= 180 ? bx : bx + 360;
      inner.style.transition = 'transform .55s cubic-bezier(.22,.61,.36,1)';
      draw();
    }
    function flipOnce() {
      var m = ((ay % 360) + 360) % 360;
      var base = ay - m;
      ay = (m > 90 && m < 270) ? base : base + 180;
      var mx = ((ax % 360) + 360) % 360;
      ax = mx <= 180 ? ax - mx : ax - mx + 360;
      inner.style.transition = 'transform .55s cubic-bezier(.22,.61,.36,1)';
      draw();
    }
    var coarse = !!(window.matchMedia && window.matchMedia('(hover:none), (pointer:coarse)').matches);
    if (!coarse) inner.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('a,button,input,textarea,select,#mark,.avatar')) return;
      e.preventDefault();                 /* 阻止选字 / 原生拖拽 / 拖出开新页 */
      dragging = true; moved = false;
      txA = ax; txY = ay;
      lx = e.clientX; ly = e.clientY;
      inner.style.transition = 'none';
      try { inner.setPointerCapture(e.pointerId); } catch (err) {}
    });
    if (!coarse) inner.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.clientX - lx, dy = e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      var cap = 46;                       /* 单帧限幅：快速甩也不会跳大角度 */
      dx = Math.max(-cap, Math.min(cap, dx));
      dy = Math.max(-cap, Math.min(cap, dy));
      txY += dx * 0.7;
      txA += dy * 0.7;
      if (!raf) raf = requestAnimationFrame(follow);
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (reduceMove) inner.style.transition = 'none';
      if (moved) snap(); else flipOnce();
    }
    if (!coarse) {
      inner.addEventListener('pointerup', endDrag);
      inner.addEventListener('pointercancel', endDrag);
      inner.style.cursor = 'grab';
    } else {
      /* 触屏：点一下翻面，不做拖拽旋转 */
      inner.addEventListener('click', function (e) {
        if (e.target.closest && e.target.closest('a,button,input,textarea,select,#mark,.avatar')) return;
        flipOnce();
      });
    }
    if (reduceMove) inner.style.transition = 'none';
    if (/[?&]flip=1/.test(q)) { ay = 180; draw(); }
    var pm = /[?&]pose=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(q);
    if (pm) { ax = parseFloat(pm[1]); ay = parseFloat(pm[2]); draw(); }
    /* 视角流光：光泽层跟随鼠标在卡上的位置（视角函数，不是时间动画） */
    var shine = inner.querySelector('.card-shine');
    if (shine && !reduceMove) {
      document.addEventListener('pointermove', function (e) {
        var r = inner.getBoundingClientRect();
        if (!r.width) return;
        var mx = ((e.clientX - r.left) / r.width) * 100;
        var my = ((e.clientY - r.top) / r.height) * 100;
        shine.style.setProperty('--mx', Math.max(-20, Math.min(120, mx)) + '%');
        shine.style.setProperty('--my', Math.max(-20, Math.min(120, my)) + '%');
      });
    }
  })();

  /* ⑧ 窄屏整卡等比缩放：内在尺寸 560×353 一像素不改，只把整张卡缩下来 */
  (function () {
    var fit = document.querySelector('.card-fit');
    var c3 = document.getElementById('card3d');
    if (!fit || !c3) return;
    function apply() {
      var avail = document.documentElement.clientWidth - 32;
      var k = Math.min(1, avail / 620);
      c3.style.transform = 'scale(' + k + ')';
      fit.style.height = (c3.offsetHeight * k) + 'px';
    }
    apply();
    window.addEventListener('resize', apply);
    window.addEventListener('orientationchange', apply);
  })();

  /* ⑥ 页脚计时（可在 /定制台/ 关掉） */
  var statsEl = document.getElementById('stats') || document.createElement('i');
  if (!FOOTER_TIMER) {
    statsEl.style.display = 'none';
  } else {
    var t0 = Date.now();
    (function tick() {
      var s = Math.floor((Date.now() - t0) / 1000);
      statsEl.textContent = s < 3 ? '' : '你在这里待了 ' + s + ' 秒';
      setTimeout(tick, 1000);
    })();
  }


</script>
</body>
</html>
