    <p>你好！见字如面。这里是阿玖和小鱼。</p>

    <p>第一篇其实没有想好要写什么，就像人生很多事情总是出乎意料的开始。转眼就进入冬天了，这一年还是蛮快的。</p>

    <p>想寄一片落叶给你，又担心你不喜欢，索性挑了一片夹在书里，来日再说。</p>
